# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: payment.dashboard.payment.dashboard
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: corebanking01cdmdt
          url: http://c4bifs.cloud:44300
          client: '500'
        app:
          name: ZPAYMENTDB
          package: Z_PAYMENT_DASHBOARD
          transport: 'IFSK000033'
        exclude:
          - /test/
          - /localService/
